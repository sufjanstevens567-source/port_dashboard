<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portfolio Deployment Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.0/dist/chart.umd.js" integrity="sha384-iU8HYtnGQ8Cy4zl7gbNMOhsDTTKX02BTXptVP/vqAWIaTfM7isw76iyZCsjL2eVi" crossorigin="anonymous"></script>
<style>
:root {
  color-scheme: light;
  --bg: #f7f7f5;
  --surface: #fff;
  --border: #e5e5e2;
  --text: #1a1a18;
  --muted: #6b6b66;
  --subtle: #9b9b96;
  --accent: #1d4ed8;
  --success: #16a34a;
  --warn: #d97706;
  --danger: #dc2626;
  --staging: #8b5cf6;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.5}
#app{max-width:1360px;margin:0 auto;padding:12px}
/* ── Header ── */
.hdr{display:flex;align-items:center;justify-content:space-between;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:12px 16px;margin-bottom:10px;gap:8px;flex-wrap:wrap}
.hdr-left{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.hdr-right{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.hdr h1{font-size:1rem;font-weight:700}
.badge{font-size:0.6875rem;background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:2px 8px;color:var(--muted);white-space:nowrap}
.price-status{font-size:0.75rem;color:var(--muted)}
/* ── Buttons ── */
.btn{padding:5px 12px;border-radius:6px;border:1px solid var(--border);background:var(--surface);color:var(--text);cursor:pointer;font-size:0.8125rem;font-weight:500;transition:all .15s;white-space:nowrap}
.btn:hover{background:var(--bg)}
.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn.primary:hover{background:#1e40af}
.btn.sm{padding:3px 8px;font-size:0.75rem}
.btn.danger{background:var(--danger);color:#fff;border-color:var(--danger)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.loading{opacity:.7;cursor:wait}
/* ── Banners ── */
.banner{border-radius:8px;padding:10px 14px;margin-bottom:10px;display:flex;align-items:flex-start;gap:10px;border:1.5px solid}
.banner.crash{background:#fef2f2;border-color:var(--danger)}
.banner.warn{background:#fffbeb;border-color:#fbbf24}
.banner.info{background:#eff6ff;border-color:#93c5fd}
.banner-icon{font-size:1rem;flex-shrink:0;margin-top:1px}
.banner-body strong{display:block;font-weight:600;font-size:.875rem;margin-bottom:2px}
.banner-body p{font-size:.8125rem;color:var(--muted)}
/* ── Tabs ── */
.tabs{display:flex;gap:4px;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:3px;margin-bottom:10px;width:fit-content}
.tab{padding:4px 14px;border-radius:6px;border:none;background:transparent;color:var(--muted);cursor:pointer;font-size:.8125rem;font-weight:500;transition:all .15s}
.tab.on{background:var(--text);color:#fff}
.tab:hover:not(.on){background:var(--bg);color:var(--text)}
/* ── Cards ── */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:8px;margin-bottom:10px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:12px 14px}
.card.ac{border-color:var(--accent);background:#eff6ff}
.card.wc{border-color:#fbbf24;background:#fffbeb}
.card.dc{border-color:var(--danger);background:#fef2f2}
.card-lbl{font-size:.6875rem;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-bottom:2px}
.card-val{font-size:1.4rem;font-weight:700;line-height:1.2}
.card-sub{font-size:.6875rem;color:var(--muted);margin-top:3px}
.card-txt{font-size:.8125rem;font-weight:500;color:var(--accent);line-height:1.45}
.pbar{height:8px;border-radius:4px;background:#e5e7eb;overflow:hidden;margin-top:5px}
.pbar-fill{height:100%;border-radius:4px;background:var(--accent);transition:width .3s}
/* ── Section ── */
.sec{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:14px 16px;margin-bottom:10px}
.sec h2{font-size:.9375rem;font-weight:600;margin-bottom:10px}
.sec h3{font-size:.8125rem;font-weight:600;margin-bottom:6px}
hr.div{border:none;border-top:1px solid var(--border);margin:10px 0}
/* ── Trigger Ladder ── */
.ladder{display:flex;flex-direction:column;gap:6px}
.trig{border:1px solid var(--border);border-radius:8px;padding:10px 12px;display:flex;align-items:center;gap:10px}
.trig.fired{border-color:var(--warn);background:#fffbeb}
.trig.done{border-color:var(--success);background:#f0fdf4;opacity:.78}
.trig.wait{border-color:var(--border)}
.trig-dot{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.65rem;font-weight:700;flex-shrink:0}
.trig-dot.wait{background:#f3f4f6;color:var(--muted)}
.trig-dot.fired{background:#fbbf24;color:#fff}
.trig-dot.done{background:var(--success);color:#fff}
.trig-info{flex:1;min-width:0}
.trig-pct{font-size:.9375rem;font-weight:700}
.trig-det{font-size:.6875rem;color:var(--muted);margin-top:1px}
.trig-lbl{font-size:.625rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em;padding:1px 7px;border-radius:10px;margin-left:6px}
.trig-lbl.wait{background:#f3f4f6;color:var(--muted)}
.trig-lbl.fired{background:#fef3c7;color:#92400e}
.trig-lbl.done{background:#dcfce7;color:#166534}
.trig-pivot{font-size:.6875rem;color:var(--danger);font-weight:500;margin-top:3px}
/* ── Allocation chart wrapper ── */
.chart-wrap{position:relative;height:260px}
/* ── Timeline ── */
.tl{display:flex;align-items:center;overflow-x:auto;padding-bottom:8px;gap:0}
.tl-month{flex-shrink:0;width:48px;text-align:center}
.tl-dot{width:14px;height:14px;border-radius:50%;border:2px solid var(--border);background:var(--surface);margin:0 auto 3px;cursor:pointer;transition:all .2s}
.tl-dot.done{background:var(--success);border-color:var(--success)}
.tl-dot.cur{background:var(--accent);border-color:var(--accent);box-shadow:0 0 0 3px #bfdbfe}
.tl-lbl{font-size:.5625rem;color:var(--muted)}
.tl-amt{font-size:.5rem;color:var(--subtle)}
.tl-conn{flex:1;height:2px;background:var(--border);min-width:4px}
.tl-conn.done{background:var(--success)}
/* ── Table ── */
.tbl{width:100%;border-collapse:collapse;font-size:.8125rem}
.tbl th{text-align:left;padding:6px 10px;border-bottom:1.5px solid var(--border);font-size:.6875rem;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.tbl td{padding:6px 10px;border-bottom:1px solid var(--bg)}
.tbl tr:last-child td{border-bottom:none}
.tbl tr:hover td{background:var(--bg)}
.num{text-align:right;font-variant-numeric:tabular-nums}
.tbl tfoot td{font-weight:600;border-top:2px solid var(--border);border-bottom:none}
/* ── Checklist ── */
.cl{display:flex;flex-direction:column;gap:6px}
.cl-item{display:flex;align-items:flex-start;gap:8px;padding:8px 12px;border:1px solid var(--border);border-radius:8px}
.cl-item.urg{border-color:var(--danger);background:#fef2f2}
.cl-item.act{border-color:var(--accent);background:#eff6ff}
.cl-item.inf{background:#fafafa}
.cl-num{width:20px;height:20px;border-radius:50%;background:var(--accent);color:#fff;font-size:.625rem;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.cl-num.urg{background:var(--danger)}
.cl-num.inf{background:var(--muted)}
.cl-txt{font-size:.8125rem;line-height:1.5}
/* ── Scenario ── */
.sc-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px;margin-bottom:10px}
.sc-card{border:2px solid var(--border);border-radius:8px;padding:10px 12px;cursor:pointer;transition:all .15s}
.sc-card.on{border-color:var(--accent);background:#eff6ff}
.sc-card:hover:not(.on){border-color:var(--muted)}
.sc-card h3{font-size:.8125rem;margin-bottom:2px}
.sc-card p{font-size:.6875rem;color:var(--muted)}
.sc-result{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:12px}
/* ── Settings inputs ── */
.inp-row{display:flex;align-items:center;gap:10px;margin-bottom:8px;flex-wrap:wrap}
.inp-row label{font-size:.8125rem;color:var(--muted);width:200px;flex-shrink:0}
.inp-row input,.inp-row select{padding:4px 8px;border:1px solid var(--border);border-radius:6px;font-size:.8125rem;background:var(--surface);color:var(--text);width:160px}
.inp-row input:focus,.inp-row select:focus{outline:2px solid var(--accent);outline-offset:1px}
.cap-inp{font-size:1.25rem!important;font-weight:700!important;width:200px!important;border-color:var(--accent)!important}
/* ── Flow ── */
.flow-node{border-radius:6px;padding:5px 10px;font-size:.8125rem;font-weight:500;border:1px solid;display:inline-block}
.fn-total{background:#1e293b;color:#fff;border-color:#1e293b}
.fn-inv{background:#dbeafe;color:#1e40af;border-color:#93c5fd}
.fn-stage{background:#ede9fe;color:#5b21b6;border-color:#c4b5fd}
.fn-dca{background:#e0f2fe;color:#0369a1;border-color:#7dd3fc}
.fn-dd{background:#fef3c7;color:#92400e;border-color:#fcd34d}
.fn-res{background:#dcfce7;color:#166534;border-color:#86efac}
/* ── Warnings ── */
.warn-list{display:flex;flex-direction:column;gap:6px}
.warn-item{display:flex;align-items:flex-start;gap:8px;padding:8px 12px;border-radius:6px;font-size:.8125rem}
.warn-item.hot{background:#fef2f2;border:1px solid #fca5a5}
.warn-item.ok{background:#f0fdf4;border:1px solid #86efac;color:var(--muted)}
/* ── Export ── */
.export-pre{background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:10px;font-family:'Courier New',monospace;font-size:.6875rem;white-space:pre-wrap;word-break:break-all;max-height:260px;overflow-y:auto}
/* ── Misc ── */
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.three-col{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.tag{font-size:.625rem;font-weight:600;padding:1px 7px;border-radius:10px;display:inline-block}
.tag.eq{background:#dbeafe;color:#1e40af}
.tag.def{background:#dcfce7;color:#166534}
.tag.real{background:#fef3c7;color:#92400e}
.tag.m0{background:#ede9fe;color:#5b21b6}
.dot-chip{width:10px;height:10px;border-radius:2px;flex-shrink:0;display:inline-block}
.legend{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.leg-item{display:flex;align-items:center;gap:4px;font-size:.6875rem;color:var(--muted)}
.gap-bar{height:6px;border-radius:3px;background:#e5e7eb;overflow:hidden;margin-top:3px}
.gap-fill{height:100%;border-radius:3px;transition:width .3s}
.toast{position:fixed;bottom:20px;right:20px;background:#1e293b;color:#fff;padding:10px 16px;border-radius:8px;font-size:.8125rem;z-index:9999;opacity:0;transition:opacity .3s;pointer-events:none;max-width:320px}
.toast.show{opacity:1}
textarea.notes{width:100%;min-height:72px;border:1px solid var(--border);border-radius:6px;padding:8px 10px;font-size:.8125rem;font-family:inherit;resize:vertical}
/* ── Collapsible detail groups ── */
.dg{margin-bottom:8px}
.dg-hdr{display:flex;justify-content:space-between;align-items:center;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:11px 16px;cursor:pointer;user-select:none;transition:background .15s}
.dg-hdr.open{border-bottom-left-radius:0;border-bottom-right-radius:0}
.dg-hdr:hover{background:var(--bg)}
.dg-title{font-size:.9375rem;font-weight:600}
.dg-body{border:1px solid var(--border);border-top:none;border-bottom-left-radius:8px;border-bottom-right-radius:8px;padding:10px;display:flex;flex-direction:column;gap:8px;background:var(--bg)}
.dg-body>.sec,.dg-body>.two-col,.dg-body>.three-col{margin-bottom:0}
@media(max-width:700px){.two-col,.three-col{grid-template-columns:1fr}.cards{grid-template-columns:1fr 1fr}}
@media print{.btn,.tabs{display:none}}
</style>
</head>

<script>

// ══════════════════════════════════════════════════════════════════

const PLAN = {

function deriveConfig(T) {
  const r = f => Math.round(T * f);
  return {
    totalCapital: T,
    baseTargets:  Object.fromEntries(ASSETS.map(a=>[a, r(PLAN.targetFrac[a])])),
    month0Buys:   Object.fromEntries(ASSETS.map(a=>[a, r(PLAN.month0Frac[a])])),
    monthlyDCA:   Object.fromEntries(DCA_ASSETS.map(a=>[a, r(PLAN.dcaFrac[a])])),
    triggers: PLAN.triggers.map(t=>({
      threshold: t.threshold,
      total: r(t.frac),
      VWCE: r(t.vf), XDW0: r(t.xf),
      pivot: !!t.pivot
    })),
    dcaMonths: 18,
    drawdownReserve: r(81/300),
    completionReserve: r(15/300),
    dcaTotal: r(54/300)
  };
}

// ══════════════════════════════════════════════════════════════════
// 2. STATE
// ══════════════════════════════════════════════════════════════════
const DEFAULT_STATE = {
  totalCapital: 300000,
  currentMonth: 0,
  startDate: '',
  startLevel: '',    // S&P 500 level on Day 1 of plan — reference for drawdown triggers
  currentLevel: '',  // Current S&P 500 level — updated manually
  athLevel: '',      // Optional: all-time high level — for context only, not used for triggers
  manualDrawdown: '', // Direct % override — takes priority over start/current levels

  dcaCompleted: {},
  triggersExecuted: {},
  triggersAlerted: {},

  viewBy: 'asset',

  lastExportedAt: null,             // timestamp of last manual export
  lastPriceUpdatedAt: null,         // timestamp of last S&P 500 level update
  deepCrashPivotActivated: false,   // latching — set when market drops to ≤−30%, never auto-cleared
  marketValues: {},                 // optional current market value per asset (for P&L tracking)
  detailSectionCollapsed: {}        // collapse state for detailed-view section groups
};

// ATH drawdown — optional, context-only (not used for trigger logic)
function getATHDrawdownPct() {
  const ath = parseFloat(S.athLevel);
  const cl  = parseFloat(S.currentLevel);
  if (ath > 0 && cl > 0) return (cl - ath) / ath * 100;
  return null;
}

let S = {};  // current state
let C = {};  // derived config
let allocationChart = null;
let guideChart = null;
let undoState = null;  // snapshot before last destructive action
let undoTimer = null;

// ── Asset guide data ─────────────────────────────────────────────
const ASSET_GUIDE = {

  },

  },
  CMOE: {

    why:   'Commodities tend to perform well in stagflation (when both equities and bonds struggle). Provides genuine diversification — low long-term correlation to both equities and bonds.',

    color: '#d97706',
    returns: [7, -10, 28, 16, -8, 3]
  },
  SGLD: {
    full:  'Invesco Physical Gold ETC',
    role:  'Gold — crisis hedge and currency debasement protection',
    what:  'Backed by allocated physical gold held in secure vaults. Tracks the gold spot price in USD, converted to EUR. An ETC (exchange-traded commodity), not a fund.',
    why:   'Gold historically performs best in genuine crises: currency debasement, financial system stress, geopolitical shocks. Its low and sometimes negative correlation to equities makes it a genuine portfolio diversifier. Largest initial allocation alongside ERNX.',

const GUIDE_YEARS = ['2019','2020','2021','2022','2023','2024'];

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) S = Object.assign({}, DEFAULT_STATE, JSON.parse(raw));
    else S = {...DEFAULT_STATE};
  } catch { S = {...DEFAULT_STATE}; }
  C = deriveConfig(S.totalCapital || 300000);
}

function saveState() {
  try {
    const payload = JSON.stringify(S);
    localStorage.setItem(STORAGE_KEY, payload);
    // Keep a rolling auto-backup — survives accidental clears of the primary key
    if (S.month0Complete) localStorage.setItem(STORAGE_KEY + '_backup', payload);
  } catch {}
}

function recoverFromBackup() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY + '_backup');
    if (!raw) { toast('No backup found', 4000); return; }
    S = Object.assign({}, DEFAULT_STATE, JSON.parse(raw));
    C = deriveConfig(S.totalCapital || 300000);
    saveState(); render();
    toast('State recovered from auto-backup ✓');
  } catch { toast('Backup recovery failed', 4000); }
}

function getMV(a) {
  const v = S.marketValues && parseFloat(S.marketValues[a]);
  return (v > 0) ? v : (S.holdings[a] || 0);
}
function hasAnyMV() { return S.marketValues && ASSETS.some(a => parseFloat(S.marketValues[a]) > 0); }
function getTotalMV()  { return ASSETS.reduce((s, a) => s + getMV(a), 0); }
function getPnL()      { return getTotalMV() - getTotalInvested(); }

const fmt  = n => (n==null||isNaN(n)) ? '—' : '€'+Math.round(n).toLocaleString('en-IE');
const fmtP = n => (n==null||isNaN(n)) ? '—' : n.toFixed(1)+'%';

// 4. CALCULATIONS
// ══════════════════════════════════════════════════════════════════
function getDrawdown() {
  if (S.manualDrawdown !== '' && S.manualDrawdown !== null && S.manualDrawdown !== undefined) {
    const v = parseFloat(S.manualDrawdown);
    return isNaN(v) ? 0 : v / 100;
  }
  const sl = parseFloat(S.startLevel), cl = parseFloat(S.currentLevel);
  if (sl > 0 && cl > 0) return (cl - sl) / sl;
  return 0;
}

function getDrawdownPct() { return getDrawdown() * 100; }

function getTotalInvested() {
  return Object.values(S.holdings).reduce((a,b)=>a+(b||0),0);
}

function getStagingRemaining() { return C.totalCapital - getTotalInvested(); }

function getTriggerStatus(t) {
  if (S.triggersExecuted[String(t.threshold)]) return 'done';
  const dd = getDrawdownPct();
  if (dd <= t.threshold) return 'fired';
  return 'wait';
}

function isDeepCrash() { return getDrawdownPct() <= -30; }

// Fix #7 — auto-detect expected plan month from start date
function getExpectedPlanMonth() {
  if (!S.startDate) return null;
  const start = new Date(S.startDate);
  if (isNaN(start.getTime())) return null;
  const now = new Date();
  const months = (now.getFullYear() - start.getFullYear()) * 12 + (now.getMonth() - start.getMonth());
  return Math.max(0, Math.min(18, months));
}

// Fix #2 — single authoritative action object used by the action banner
// Returns { cls, icon, title, text, btn } where btn is optional HTML string
function buildActionBanner() {
  const dd      = getDrawdownPct();
  const staging = getStagingRemaining();
  const m       = S.currentMonth || 0;
  const mLeft   = Math.max(0, 18 - m);

  // 1. Unfired triggers — highest priority
  const firedTriggers = C.triggers.filter(t => getTriggerStatus(t) === 'fired');
  if (firedTriggers.length === 1) {
    const t = firedTriggers[0];
    return { cls:'crash', icon:'⚡',
      title: `Urgent: market is down ${Math.abs(t.threshold)}% from your plan start`,
      text:  `Deploy ${fmt(t.total)} now — ${fmt(t.VWCE)} into VWCE and ${fmt(t.XDW0)} into XDW0. This is a pre-planned opportunistic buy, not a panic move.`,
      btn:   `<button class="btn danger sm" data-action="execute-trigger" data-threshold="${t.threshold}">Mark executed ✓</button>` };
  }
  if (firedTriggers.length > 1) {
    const totalDeploy = firedTriggers.reduce((s,t)=>s+t.total,0);
    const btns = firedTriggers.map(t=>`<button class="btn danger sm" data-action="execute-trigger" data-threshold="${t.threshold}" style="margin:2px">${t.threshold}% ✓</button>`).join('');
    return { cls:'crash', icon:'⚡',
      title: `Urgent: ${firedTriggers.length} buy triggers fired`,
      text:  `Market has fallen through ${firedTriggers.length} thresholds. Total to deploy: ${fmt(totalDeploy)}. Execute each trigger below.`,
      btn:   `<div style="display:flex;flex-wrap:wrap;gap:4px">${btns}</div>` };
  }
  // 2. Past Month 18 deadline
  if (m > 18 && staging > 1) {
    return { cls:'crash', icon:'⚠',
      title: 'Past your 18-month deployment deadline',
      text:  `${fmt(staging)} is still undeployed. Your plan required full allocation by Month 18.`,
      btn:   '' };
  }
  // 3. Initial investment not yet done
  if (!S.month0Complete) {
    const b = C.month0Buys;
    return { cls:'info', icon:'[1]',
      title: 'First action: make your initial lump-sum investment',
      text:  `Buy across all assets: ${fmt(b.VWCE)} VWCE · ${fmt(b.XDW0)} XDW0 · ${fmt(b.IBCI)} IBCI · ${fmt(b.ERNX)} ERNX · ${fmt(b.Cash)} Cash · ${fmt(b.CMOE)} CMOE · ${fmt(b.SGLD)} SGLD`,
      btn:   `<button class="btn primary sm" data-action="mark-month0">Mark done ✓</button>` };
  }
  // 4. Monthly buy overdue
  for (let i = 1; i <= m && i <= 18; i++) {
    if (!S.dcaCompleted[String(i)]) {
      const d = C.monthlyDCA;
      return { cls:'warn', icon:'→',
        title: `Month ${i} monthly buy is due`,
        text:  `Buy: ${fmt(d.VWCE)} VWCE · ${fmt(d.XDW0)} XDW0 · ${fmt(d.IBCI)} IBCI · ${fmt(d.ERNX)} ERNX · ${fmt(d.CMOE)} CMOE · ${fmt(d.SGLD)} SGLD`,
        btn:   `<button class="btn primary sm" data-action="mark-dca" data-month="${i}">Mark done ✓</button>` };
    }
  }
  // 5. Deep crash — no specific trigger, but pivot needed
  if (isDeepCrash()) {
    return { cls:'crash', icon:'⚡',
      title: 'Market down 30%+ — pivot to equities only',
      text:  'Stop monthly buys for IBCI, ERNX, CMOE, SGLD. Use all remaining undeployed capital to buy VWCE and XDW0.',
      btn:   '' };
  }
  // 6. Month 18 approaching
  if (m >= 13 && staging > 1 && mLeft > 0) {
    return { cls:'warn', icon:'⏱',
      title: `Month 18 approaching — ${mLeft} months left to fully invest`,
      text:  `${fmt(staging)} still to deploy. Aim for ~${fmt(staging/mLeft)}/month to meet the deadline.`,
      btn:   '' };
  }
  // 6b. Post-depletion: all triggers executed, staging gone, still in a crash
  const allTriggersExecuted = C.triggers.every(t => S.triggersExecuted[String(t.threshold)]);
  if (allTriggersExecuted && staging <= 1 && dd <= -30 && S.month0Complete) {
    return { cls:'info', icon:'✓',
      title: 'All reserves deployed — fully invested during a market crash',
      text:  `All 5 opportunistic triggers have fired and your staging reserve is fully deployed. No further action under this plan. Stay the course — your portfolio is positioned to recover when markets normalise.${m < 18 ? ' Monthly DCA continues as normal.' : ''}`,
      btn:   '' };
  }
  // 6c. Deep-crash recovery: market recovered above −30% but pivot was previously activated
  if (S.deepCrashPivotActivated && !isDeepCrash() && S.month0Complete) {
    return { cls:'warn', icon:'🔄',
      title: 'Market has recovered above the deep-crash pivot level',
      text:  `Market is now at ${fmtP(dd)} — above your −30% pivot threshold. Your portfolio is likely equity-heavy from the pivot. Consider gradually resuming IBCI, ERNX, CMOE, and SGLD DCA over the next 2–4 months to return toward your base targets.`,
      btn:   `<button class="btn primary sm" data-action="clear-pivot-flag">Acknowledge recovery ✓</button>` };
  }
  // 7. All good
  const nextT = C.triggers.find(t => getTriggerStatus(t) === 'wait');
  const ddSet = (S.manualDrawdown!==''&&S.manualDrawdown!=null)||(parseFloat(S.startLevel)>0&&parseFloat(S.currentLevel)>0);
  if (!ddSet && S.month0Complete) {
    return { cls:'warn', icon:'👁',
      title: 'Drawdown monitoring inactive',
      text:  'Enter your Day 1 S&P 500 level in the Price Tracker below to activate buy-trigger detection. Without it, you\'ll miss opportunistic buys.',
      btn:   '' };
  }
  if (ddSet && !S.monitorTaskUpdated && S.month0Complete) {
    return { cls:'warn', icon:'📡',
      title: 'Daily email alerts not yet active',
      text:  `Your automated monitoring task still has a placeholder start level. Open the Scheduled sidebar → portfolio-sp500-monitor and replace SET_THIS_ONCE with your start level (${parseFloat(S.startLevel)>0 ? S.startLevel : 'your Day 1 S&P 500 level'}) to activate daily email alerts.`,
      btn:   `<button class="btn primary sm" data-action="mark-monitor-done">Done ✓</button>` };
  }
  return { cls:'info', icon:'✓',
    title: 'On track — continue your monthly buys',
    text:  nextT
      ? `No market drop to act on (drawdown: ${fmtP(dd)}). Continue monthly buys. Next opportunistic trigger: market drops ${Math.abs(nextT.threshold)}% from your start → deploy ${fmt(nextT.total)}.`
      : m >= 18 && staging <= 1 ? 'Plan complete — all capital deployed.'
      : `Continue monthly buys. ${fmt(staging)} still to invest over ${mLeft} months.`,
    btn: '' };
}

function calcWarnings() {
  const dd = getDrawdownPct();
  const invested = getTotalInvested();
  const staging = getStagingRemaining();
  const warnings = [];
  C.triggers.forEach(t => {
    if (getTriggerStatus(t)==='fired') warnings.push(`Trigger ${t.threshold}% fired but not executed. Deploy ${fmt(t.total)}.`);
  });
  if ((S.currentMonth||0) > 18 && staging > 1) warnings.push(`Past Month 18. ${fmt(staging)} staging reserve unallocated.`);
  if (invested > C.totalCapital + 1) warnings.push(`Total deployed (${fmt(invested)}) exceeds total capital (${fmt(C.totalCapital)}).`);
  if (isDeepCrash() && (S.currentMonth||0) < 18) warnings.push(`Deep-crash pivot active. Pause monthly buys for IBCI, ERNX, CMOE, SGLD. Redirect all remaining capital to VWCE/XDW0.`);
  return warnings;
}

function addTx(type, desc, amount) {
  const date = new Date().toLocaleDateString('en-IE');
  S.transactions = [...(S.transactions||[]), {date, type, desc, amount}];
}

function markMonth0() {
  if (S.month0Complete) return;
  saveUndoState();
  const buys = C.month0Buys;
  const h = {...S.holdings};
  ASSETS.forEach(a => { h[a] = (h[a]||0) + buys[a]; });
  addTx('month0','Month 0 initial investment', Object.values(buys).reduce((a,b)=>a+b,0));
  setState({month0Complete:true, holdings:h});
  toast('Month 0 marked complete ✓', 15000, true);
}

function markDCA(m) {
  if (S.dcaCompleted[String(m)]) return;
  saveUndoState();
  const d = C.monthlyDCA;
  const h = {...S.holdings};
  let total = 0;
  DCA_ASSETS.forEach(a => { h[a]=(h[a]||0)+d[a]; total+=d[a]; });
  addTx('dca',`Month ${m} monthly buy`, total);
  setState({dcaCompleted:{...S.dcaCompleted,[String(m)]:true}, holdings:h});
  toast(`Month ${m} monthly buy marked complete ✓`, 15000, true);
}

function executeTrigger(threshold) {
  const t = C.triggers.find(x=>x.threshold===threshold);
  if (!t || S.triggersExecuted[String(threshold)]) return;
  saveUndoState();
  const h = {...S.holdings};
  h.VWCE = (h.VWCE||0) + t.VWCE;
  h.XDW0 = (h.XDW0||0) + t.XDW0;
  addTx('trigger',`Drawdown trigger ${threshold}% executed`, t.total);
  setState({
    triggersExecuted:{...S.triggersExecuted,[String(threshold)]:{date:new Date().toLocaleDateString('en-IE')}},
    holdings:h
  });
  toast(`Trigger ${threshold}% executed ✓`, 15000, true);
}

function toast(msg, dur=3000, undoable=false) {
  const el = document.getElementById('toast');
  if (!el) return;
  if (undoable && undoState) {
    el.innerHTML = `${msg} &nbsp;<button onclick="undoLastAction()" style="background:rgba(255,255,255,0.2);border:1px solid rgba(255,255,255,0.4);color:#fff;padding:2px 8px;border-radius:4px;cursor:pointer;font-size:.75rem;margin-left:4px">Undo</button>`;
  } else {
    el.textContent = msg;
  }
  el.classList.add('show');
  setTimeout(()=>el.classList.remove('show'), dur);
}

function saveUndoState() {
  undoState = JSON.parse(JSON.stringify(S));
  if (undoTimer) clearTimeout(undoTimer);
  undoTimer = setTimeout(() => { undoState = null; }, 15000);
}

function undoLastAction() {
  if (!undoState) return;
  S = undoState;
  undoState = null;
  C = deriveConfig(S.totalCapital || 300000);
  saveState();
  render();
  toast('Action undone ✓');
}

// Call this whenever drawdown may have changed (price or manual entry updated).
// Compares previous DD to new DD and creates Gmail draft alerts for any newly-fired triggers.
async function checkAndAlertTriggers(prevDD, newDD) {
  const alerted = S.triggersAlerted || {};
  const newlyFired = C.triggers.filter(t => {
    const key = String(t.threshold);
    return newDD <= t.threshold && prevDD > t.threshold && !alerted[key] && !S.triggersExecuted[key];
  });
  if (!newlyFired.length) return;

  for (const t of newlyFired) {
    const key = String(t.threshold);
    try {
      await window.cowork.callMcpTool(GMAIL_TOOL, {
        to: [USER_EMAIL],
        subject: `⚡ Portfolio trigger fired: ${t.threshold}% drawdown`,
        htmlBody: `<h2 style="color:#dc2626">Drawdown trigger ${t.threshold}% has fired</h2>
<p>Your S&amp;P 500 drawdown from your plan start has reached <strong>${fmtP(newDD)}</strong>.</p>
<h3>Action required</h3>
<p>Deploy <strong>${fmt(t.total)}</strong>:</p>
<ul><li><strong>${fmt(t.VWCE)}</strong> into VWCE</li><li><strong>${fmt(t.XDW0)}</strong> into XDW0</li></ul>
${t.pivot ? '<p style="color:#dc2626"><strong>⚡ Deep-crash pivot activates at this level.</strong> Pause DCA for IBCI, ERNX, CMOE, SGLD and redirect remaining capital to VWCE/XDW0.</p>' : ''}
<hr><p style="font-size:12px;color:#666">Generated by your Portfolio Deployment Dashboard · ${new Date().toLocaleString('en-IE')}</p>`
      });
      setState({triggersAlerted:{...S.triggersAlerted,[key]:true}});
      toast(`📧 Gmail draft created for ${t.threshold}% trigger`);
    } catch(e) {
      toast(`Gmail alert failed: ${e.message}`, 5000);
    }
  }
}

function h(tag, attrs, ...children) {
  const el = document.createElement(tag);
  if (attrs) Object.entries(attrs).forEach(([k,v])=>{
    if (k==='class') el.className=v;
    else if (k==='style') el.style.cssText=v;
    else if (k.startsWith('data-')) el.setAttribute(k,v);
    else el[k]=v;
  });
  children.forEach(c=>{
    if (c==null) return;
    if (typeof c==='string'||typeof c==='number') el.appendChild(document.createTextNode(String(c)));
    else if (c instanceof Node) el.appendChild(c);
    else if (Array.isArray(c)) c.forEach(ch=>ch instanceof Node && el.appendChild(ch));
  });
  return el;
}
function div(cls,content){ const d=document.createElement('div'); if(cls)d.className=cls; if(content)d.innerHTML=content; return d; }

function setHtml(id, html) {
  const el = document.getElementById(id);
  if (el) el.innerHTML = html;
}

        <span style="width:20px;height:20px;border-radius:50%;flex-shrink:0;background:${s.done?'var(--success)':'#d1d5db'};color:${s.done?'#fff':'#6b7280'};font-size:.625rem;font-weight:700;display:flex;align-items:center;justify-content:center;margin-top:1px">${s.done?'✓':i+1}</span>
        <div style="flex:1;font-size:.8125rem;${s.done&&!s.input?'text-decoration:line-through;color:var(--muted)':''}">${s.input ? s.input : s.text}</div>
      </div>`).join('');
    html += `<div class="banner info" style="flex-direction:column;align-items:flex-start">
      <div style="display:flex;align-items:center;gap:8px;width:100%">
        <span style="font-size:1.1rem">👋</span>
        <strong>Launch checklist — ${[step1Done,step2Done,step3Done,step4Done].filter(Boolean).length} of 4 steps complete</strong>
      </div>
      ${stepsHtml}
    </div>`;
  }

  // ── Export overdue reminder (post-launch) ──
  if (S.month0Complete) {
    const daysSinceExport = S.lastExportedAt ? Math.floor((Date.now()-S.lastExportedAt)/86400000) : Infinity;
    if (daysSinceExport > 30) {
      html += `<div class="banner warn"><span class="banner-icon">💾</span><div class="banner-body" style="flex:1">
        <strong>${daysSinceExport === Infinity ? 'You have never exported your state' : `No export in ${daysSinceExport} days`}</strong>
        <p>Your progress is stored in this browser only. Export a backup so you can recover it if you switch devices or clear your cache.</p>
      </div>
      <button class="btn sm" data-action="dl-status" style="flex-shrink:0;margin-left:8px">Export now</button>
      </div>`;
    }
  }

  // ── Price staleness warning (post-launch) ──
  if (S.month0Complete) {
    const daysSincePrice = S.lastPriceUpdatedAt
      ? Math.floor((Date.now() - S.lastPriceUpdatedAt) / 86400000)
      : Infinity;
    if (daysSincePrice > 7) {
      html += `<div class="banner warn"><span class="banner-icon">📈</span><div class="banner-body" style="flex:1">
        <strong>${daysSincePrice === Infinity ? 'S&amp;P 500 level not yet entered' : `S&amp;P 500 level last updated ${daysSincePrice} days ago`}</strong>
        <p>Update the current S&amp;P 500 level in the Price Tracker — a ${Math.abs(C.triggers[0]?.threshold||10)}% market drop could go undetected until you do.</p>
      </div></div>`;
    }
  }

  // ── Fix #2: Action banner — always visible, highest priority action ──
  const ab = buildActionBanner();
  const bannerBg   = ab.cls==='crash' ? '#fef2f2' : ab.cls==='warn' ? '#fffbeb' : '#eff6ff';
  const bannerBdr  = ab.cls==='crash' ? 'var(--danger)' : ab.cls==='warn' ? '#fbbf24' : '#93c5fd';
  const iconColor  = ab.cls==='crash' ? 'var(--danger)' : ab.cls==='warn' ? 'var(--warn)' : 'var(--accent)';
  html += `<div class="banner" style="background:${bannerBg};border-color:${bannerBdr};align-items:center">
    <span class="banner-icon" style="color:${iconColor};font-size:1.1rem;font-weight:700;min-width:20px;text-align:center">${ab.icon}</span>
    <div class="banner-body" style="flex:1">
      <strong>${ab.title}</strong>
      <p>${ab.text}</p>
    </div>
    ${ab.btn ? `<div style="flex-shrink:0;margin-left:8px">${ab.btn}</div>` : ''}
  </div>`;

  // ── Fix #4 (deep crash): plain-English explanation ──
  if (isDeepCrash()) {
    html += `<div class="banner crash"><span class="banner-icon">⚡</span><div class="banner-body">
      <strong>What "market down 30%" means for your plan</strong>
      <p>Stop your monthly buys for IBCI (inflation bonds), ERNX (short bonds), CMOE (commodities), and SGLD (gold). Redirect all remaining undeployed capital to VWCE and XDW0 — these are the most discounted assets in a severe crash, and your plan is designed to concentrate equity exposure precisely at moments like this.</p>
    </div></div>`;
  }

  // ── Fix #7: Month lag warning ──
  const expectedMonth = getExpectedPlanMonth();
  const recordedMonth = S.currentMonth || 0;
  if (expectedMonth !== null && step3Done && expectedMonth > recordedMonth) {
    html += `<div class="banner warn"><span class="banner-icon">📅</span><div class="banner-body" style="flex:1">
      <strong>Plan month counter may need updating</strong>
      <p>Your start date suggests you're in plan month ${expectedMonth}, but the counter shows month ${recordedMonth}. Update it if that's right.</p>
    </div>
    <button class="btn sm" data-action="set-month-auto" data-month="${expectedMonth}" style="flex-shrink:0;margin-left:8px">Set to Month ${expectedMonth}</button>
    </div>`;
  }

  setHtml('banners', html);
}

// ── Next Action Checklist ─────────────────────────────────────────
// Fix #5: all jargon replaced with plain language; action buttons added inline
function renderChecklist() {
  const dd      = getDrawdownPct();
  const staging = getStagingRemaining();
  const m       = S.currentMonth || 0;
  const mLeft   = Math.max(0, 18 - m);
  // items: { cls, text, btn? }
  const items   = [];

  // Fired triggers (highest urgency)
  C.triggers.forEach(t => {
    if (getTriggerStatus(t) === 'fired') {
      items.push({ cls:'urg',
        text: `Market has dropped ${Math.abs(t.threshold)}% from your start. Deploy ${fmt(t.total)}: ${fmt(t.VWCE)} into VWCE + ${fmt(t.XDW0)} into XDW0. This is a planned opportunistic buy.`,
        btn:  `<button class="btn danger sm" data-action="execute-trigger" data-threshold="${t.threshold}" style="margin-top:6px">Mark executed ✓</button>` });
    }
  });

  // Past deadline
  if (m > 18 && staging > 1) {
    items.push({ cls:'urg', text: `Past your 18-month investment deadline. ${fmt(staging)} is still undeployed. Invest it now across your base target allocations.` });
  }

  // Initial investment not made
  if (!S.month0Complete) {
    const b = C.month0Buys;
    items.push({ cls:'act',
      text: `Initial investment not yet made. Buy: ${fmt(b.VWCE)} VWCE · ${fmt(b.XDW0)} XDW0 · ${fmt(b.IBCI)} IBCI · ${fmt(b.ERNX)} ERNX · ${fmt(b.Cash)} Cash · ${fmt(b.CMOE)} CMOE · ${fmt(b.SGLD)} SGLD`,
      btn:  `<button class="btn primary sm" data-action="mark-month0" style="margin-top:6px">Mark done ✓</button>` });
  }

  // Monthly buys overdue — show only the oldest, with count if multiple
  const overdueMonths = [];
  for (let i = 1; i <= m && i <= 18; i++) {
    if (!S.dcaCompleted[String(i)]) overdueMonths.push(i);
  }
  if (overdueMonths.length > 0) {
    const first = overdueMonths[0];
    const extra = overdueMonths.length - 1;
    const d = C.monthlyDCA;
    // Show DCA timing hint if set
    let timingHint = '';
    if (S.dcaDay && S.startDate) {
      const start = new Date(S.startDate);
      const buyDate = new Date(start.getFullYear(), start.getMonth() + first, Math.min(parseInt(S.dcaDay),28));
      const daysUntil = Math.round((buyDate - new Date()) / 86400000);
      timingHint = daysUntil >= 0 ? ` (your scheduled buy day: ${buyDate.toLocaleDateString('en-IE',{day:'numeric',month:'short'})})` : '';
    }
    items.push({ cls:'act',
      text: `Month ${first} monthly buy due${timingHint}${extra > 0 ? ` <strong>(+${extra} more month${extra>1?'s':''} also overdue)</strong>` : ''}. Buy: ${fmt(d.VWCE)} VWCE · ${fmt(d.XDW0)} XDW0 · ${fmt(d.IBCI)} IBCI · ${fmt(d.ERNX)} ERNX · ${fmt(d.CMOE)} CMOE · ${fmt(d.SGLD)} SGLD`,
      btn:  `<button class="btn primary sm" data-action="mark-dca" data-month="${first}" style="margin-top:6px">Mark Month ${first} done ✓</button>` });
  }

  // Deep crash active
  if (isDeepCrash()) {
    items.push({ cls:'urg', text: `Market is down 30%+. Switch strategy: stop monthly buys for IBCI, ERNX, CMOE, SGLD. Redirect all remaining undeployed money to VWCE and XDW0 instead.` });
  }

  // Mild drawdown — informational
  if (dd < 0 && dd > -10) {
    items.push({ cls:'inf', text: `Market is down ${fmtP(Math.abs(dd))} from your start — not enough to trigger anything yet. Your first opportunistic buy fires at −10% (${fmt(C.triggers[0]?.total)}).` });
  }

  // Month 17–18: completion reserve deployment guidance
  if (m >= 17 && m <= 18 && staging > 1) {
    const b = C.baseTargets;
    const gapRows = ASSETS.filter(a=>a!=='Cash').map(a=>{
      const gap = b[a] - (S.holdings[a]||0);
      return gap > 50 ? `${a}: ${fmt(gap)}` : null;
    }).filter(Boolean).join(' · ');
    items.push({ cls:'act',
      text: `Month ${m} — deploy your ${fmt(C.completionReserve)} completion reserve to top up base targets by Month 18.${gapRows ? ` Remaining gaps: ${gapRows}.` : ' All base targets met.'}` });
  } else if (m >= 13 && m < 17 && staging > 1 && mLeft > 0) {
    items.push({ cls:'act', text: `Month 18 approaching — ${mLeft} months left to fully invest. You have ${fmt(staging)} remaining. Aim to deploy ~${fmt(staging/mLeft)}/month on top of your regular buy.` });
  }

  // On track — no action needed
  const nextT = C.triggers.find(t => getTriggerStatus(t) === 'wait');
  if (nextT && dd >= -5 && S.month0Complete) {
    items.push({ cls:'inf', text: `No market drop to act on. Continue your monthly buys. Next opportunistic buy triggers if the market drops ${Math.abs(nextT.threshold)}% from your start → deploy ${fmt(nextT.total)}.` });
  }

  const html = items.map((item, i) => `
    <div class="cl-item ${item.cls}">
      <div class="cl-num ${item.cls}">${i+1}</div>
      <div class="cl-txt">${item.text}${item.btn ? item.btn : ''}</div>
    </div>`).join('');
  setHtml('checklist', `<div class="cl">${html || '<p style="color:var(--muted);font-size:.875rem">All caught up.</p>'}</div>`);
}

// ── Allocation Chart (Chart.js) ───────────────────────────────────
function renderAllocationChart() {
  const canvas = document.getElementById('alloc-canvas');
  if (!canvas) return;
  if (allocationChart) { allocationChart.destroy(); allocationChart = null; }

  const invested = getTotalInvested();
  const staging  = getStagingRemaining();
  const vb = S.viewBy || 'asset';

  let labels, currentData, targetData, datasets;

  if (vb === 'category') {
    labels = ['Global Equities','Energy Equities','Defensive','Real Assets','Staging Reserve'];
    const catKeys = {
      'Global Equities': ['VWCE'],
      'Energy Equities': ['XDW0'],
      'Defensive':       ['IBCI','ERNX','Cash'],
      'Real Assets':     ['CMOE','SGLD'],
      'Staging Reserve': []
    };
    const catColors = {'Global Equities':'#2563eb','Energy Equities':'#0ea5e9','Defensive':'#059669','Real Assets':'#d97706','Staging Reserve':'#8b5cf6'};
    const currentVals = labels.map(l => l==='Staging Reserve' ? staging : catKeys[l].reduce((s,a)=>s+(S.holdings[a]||0),0));
    const targetVals  = labels.map(l => l==='Staging Reserve' ? 0 : catKeys[l].reduce((s,a)=>s+(C.baseTargets[a]||0),0));
    datasets = [
      {label:'Current',     data:currentVals, backgroundColor:labels.map(l=>catColors[l]+'cc')},
      {label:'Base Target', data:targetVals,  backgroundColor:labels.map(l=>catColors[l]+'66')}
    ];
  } else {
    labels = ASSETS;
    const currentVals = ASSETS.map(a => S.holdings[a]||0);
    const targetVals  = ASSETS.map(a => C.baseTargets[a]);
    currentVals.push(staging); labels = [...ASSETS, 'Staging'];
    targetVals.push(0);
    const colors = [...ASSETS.map(a=>ASSET_COLORS[a]), '#8b5cf6'];
    datasets = [
      {label:'Current',     data:currentVals, backgroundColor:colors.map(c=>c+'cc')},
      {label:'Base Target', data:targetVals,  backgroundColor:colors.map(c=>c+'55')}
    ];
  }

  allocationChart = new Chart(canvas, {
    type: 'bar',
    data: {labels, datasets},
    options: {
      indexAxis: 'y',
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: {labels:{font:{size:11},boxWidth:12}},
        tooltip: {callbacks:{label: ctx=>`${ctx.dataset.label}: €${Math.round(ctx.raw).toLocaleString('en-IE')}`}}
      },
      scales: {
        x: {stacked:false, ticks:{callback:v=>'€'+Math.round(v/1000)+'k',font:{size:10}}, grid:{color:'#f0f0ee'}},
        y: {ticks:{font:{size:11}}}
      }
    }
  });
}

// Fix #3 (trigger ladder before checklist) + Fix #4 (remove chart/timeline from simple)
function renderSimpleView() {
  // Determine "all clear" state
  const dd         = getDrawdownPct();
  const ddSet      = (S.manualDrawdown!==''&&S.manualDrawdown!=null)||(parseFloat(S.startLevel)>0&&parseFloat(S.currentLevel)>0);
  const anyFired   = C.triggers.some(t => getTriggerStatus(t) === 'fired');
  const m          = S.currentMonth || 0;
  const overdueM   = Array.from({length:m},(_, i)=>i+1).filter(i=>i<=18&&!S.dcaCompleted[String(i)]);
  const allClear   = S.month0Complete && !anyFired && overdueM.length===0 && ddSet && !isDeepCrash() && m<=18;

  // Compute "all clear" card content
  let allClearCard = '';
  if (allClear) {
    const nextT = C.triggers.find(t => getTriggerStatus(t) === 'wait');
    const staging = getStagingRemaining();
    const mLeft   = Math.max(0, 18 - m);
    // Next DCA: compute target date from start date + next month
    let nextDCANote = '';
    if (S.dcaDay && S.startDate) {
      const start = new Date(S.startDate);
      const nextMonth = m + 1;
      if (nextMonth <= 18) {
        const buyDate = new Date(start.getFullYear(), start.getMonth() + nextMonth, Math.min(parseInt(S.dcaDay), 28));
        const daysUntil = Math.round((buyDate - new Date()) / 86400000);
        nextDCANote = daysUntil > 0 ? ` · Month ${nextMonth} buy due in ~${daysUntil} day${daysUntil!==1?'s':''}` : ` · Month ${nextMonth} buy due soon`;
      }
    } else if (m < 18) {
      nextDCANote = ` · Month ${m+1} buy not yet done`;
    }
    const nextTNote = nextT
      ? `Next trigger: market needs to drop ${fmtP(Math.abs(nextT.threshold - dd))} more (to ${nextT.threshold}%)`
      : 'All triggers executed';
    allClearCard = `
      <div style="background:#f0fdf4;border:2px solid var(--success);border-radius:10px;padding:16px 20px;margin-bottom:10px;display:flex;align-items:flex-start;gap:14px">
        <span style="font-size:1.75rem;line-height:1">✓</span>
        <div>
          <div style="font-size:1rem;font-weight:700;color:var(--success);margin-bottom:4px">No action needed right now</div>
          <div style="font-size:.8125rem;color:var(--text);margin-bottom:3px">
            <strong>Market:</strong> ${fmtP(dd)} from your start (S&P ${parseFloat(S.startLevel)>0?parseFloat(S.startLevel).toLocaleString():''}  → ${parseFloat(S.currentLevel)>0?parseFloat(S.currentLevel).toLocaleString():''})<br>
            <strong>${nextTNote}</strong>${nextDCANote}<br>
            <strong>${fmt(staging)}</strong> still to deploy over ${mLeft} month${mLeft!==1?'s':''} · plan month ${m} of 18
          </div>
        </div>
      </div>`;
  }

  setHtml('view-content', `
    ${allClearCard}
    <div class="sec"><h2>Price Tracker &amp; Drawdown</h2><div id="price-tracker"></div></div>
    <div class="sec"><h2>Opportunistic Buy Triggers</h2><div id="trigger-ladder"></div></div>
    <div class="sec"><h2>Full To-Do List</h2><div id="checklist"></div></div>
  `);
}

  const dcaTotal  = C.dcaTotal;
  const trigTotal = C.drawdownReserve;

  const stackOk   = Math.abs(stackSum - T) < 50;

    <div style="overflow-x:auto;margin-bottom:16px">
      <table style="border-collapse:collapse;width:100%">

          <th style="text-align:left;padding:4px 0 4px 10px;font-size:.6875rem;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)">Note</th>

function renderAssetGuide() {

        The chart below shows approximate annual returns for each asset (2019–2024). Data is illustrative — sourced from public indices. Past performance does not predict future returns.
      </div>

      ${cards}

      type: 'bar',
      data: {

        datasets: ASSETS.map(a => ({
          label: a,
          data: ASSET_GUIDE[a].returns,
          backgroundColor: ASSET_GUIDE[a].color + 'cc',

            title: { display:true, text:'Annual return (%)', font:{size:10} }
          }
        }
      }
    });
  });
}

// ── Price Tracker ─────────────────────────────────────────────────
function renderPriceTracker() {
  const el = document.getElementById('price-tracker');
  if (!el) return;

  const dd    = getDrawdownPct();
  const athDD = getATHDrawdownPct();
  const sl    = parseFloat(S.startLevel);
  const cl    = parseFloat(S.currentLevel);
  const ath   = parseFloat(S.athLevel);
  const ddSet = (S.manualDrawdown!==''&&S.manualDrawdown!=null) || (sl>0 && cl>0);

  // Colour helper
  const ddColor = v => v <= -30 ? 'var(--danger)' : v <= -10 ? 'var(--warn)' : v < 0 ? 'var(--text)' : 'var(--success)';

  // Which triggers are relevant given current DD
  const firedTriggers = C.triggers.filter(t => ddSet && dd <= t.threshold && !S.triggersExecuted[String(t.threshold)]);
  const nextTrigger   = C.triggers.find(t  => ddSet && dd > t.threshold && !S.triggersExecuted[String(t.threshold)]);

  // Proximity bar to next trigger (how close are we?)
  let proximityBar = '';
  if (ddSet && nextTrigger && dd < 0) {
    const pct = Math.min(100, Math.abs(dd) / Math.abs(nextTrigger.threshold) * 100);
    proximityBar = `
      <div style="margin-top:6px">
        <div style="font-size:.6875rem;color:var(--muted);margin-bottom:3px">
          Distance to next trigger (${nextTrigger.threshold}%): ${fmtP(nextTrigger.threshold - dd)} remaining
        </div>
        <div class="gap-bar"><div class="gap-fill" style="width:${pct}%;background:${pct>80?'var(--danger)':pct>50?'var(--warn)':'var(--accent)'}"></div></div>
      </div>`;
  }

  // Collapsible inputs — collapsed by default once startLevel is set
  const configDone = !!(sl > 0 || (S.manualDrawdown !== '' && S.manualDrawdown != null));
  const collapsed = configDone && (S.priceTrackerCollapsed === true);

  // Price staleness indicator
  const priceAge = S.lastPriceUpdatedAt ? Math.floor((Date.now() - S.lastPriceUpdatedAt) / 86400000) : null;
  const priceAgeLabel = priceAge === null ? '' : priceAge === 0 ? ' · updated today' : ` · updated ${priceAge}d ago`;
  const priceAgeStyle = priceAge !== null && priceAge > 7 ? 'color:var(--warn);font-weight:600' : 'color:var(--muted)';

  el.innerHTML = `
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:${collapsed?'0':'10px'}">
      ${configDone ? `<button data-action="toggle-price-tracker" class="btn sm">${collapsed?'▶ Edit levels':'▼ Done editing'}</button>` : '<span></span>'}
      ${priceAge !== null ? `<span style="font-size:.6875rem;${priceAgeStyle}">${priceAge > 7 ? '⚠' : '✓'} S&amp;P 500${priceAgeLabel}</span>` : ''}
    </div>
    <div id="price-inputs" style="display:${collapsed?'none':'block'}">
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;align-items:start">

      <!-- ── Left: level inputs ── -->
      <div>
        <div style="font-size:.6875rem;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-bottom:10px">S&amp;P 500 Levels</div>

        <div class="inp-row">
          <label style="width:190px">Day 1 of plan (start reference)</label>
          <div style="display:flex;align-items:center;gap:4px">
            <input type="number" step="0.01" value="${S.startLevel||''}" data-action="set-startlevel"
              placeholder="e.g. 5800" style="width:110px">
            <span style="font-size:.75rem;color:var(--muted)">pts</span>
          </div>
        </div>
        <div style="font-size:.6875rem;color:var(--muted);margin:-4px 0 10px 200px;line-height:1.4">
          Set once on Day 1 of the plan. All drawdown triggers are measured from this level.
        </div>

        <div class="inp-row">
          <label style="width:190px">Current level (update when checking)</label>
          <div style="display:flex;align-items:center;gap:4px">
            <input type="number" step="0.01" value="${S.currentLevel||''}" data-action="set-currentlevel"
              placeholder="Today's S&P 500" style="width:110px">
            <span style="font-size:.75rem;color:var(--muted)">pts</span>
          </div>
        </div>
        <div style="font-size:.6875rem;color:var(--muted);margin:-4px 0 10px 200px;line-height:1.4">
          Look up the current S&amp;P 500 level (e.g. on Google or Yahoo Finance) and enter it here.
        </div>

        <div class="inp-row">
          <label style="width:190px">All-time high (optional context)</label>
          <div style="display:flex;align-items:center;gap:4px">
            <input type="number" step="0.01" value="${S.athLevel||''}" data-action="set-athlevel"
              placeholder="e.g. 6100" style="width:110px">
            <span style="font-size:.75rem;color:var(--muted)">pts</span>
          </div>
        </div>
        <div style="font-size:.6875rem;color:var(--muted);margin:-4px 0 10px 200px;line-height:1.4">
          For context only — not used for trigger logic. Lets you see both metrics side by side.
        </div>

        <div style="border-top:1px solid var(--border);padding-top:10px;margin-top:4px">
          <div class="inp-row" style="margin-bottom:2px">
            <label style="width:190px">Or: enter market drop % directly</label>
            <div style="display:flex;align-items:center;gap:4px">
              <input type="number" step="0.1" min="-100" max="100" value="${S.manualDrawdown||''}" data-action="set-manual-dd"
                placeholder="e.g. -22" style="width:110px">
              <span style="font-size:.75rem;color:var(--muted)">%</span>
            </div>
          </div>
          <div style="font-size:.6875rem;color:var(--muted);margin-left:200px;line-height:1.4">Use this if you just want to quickly test a scenario. Overrides the level-based calculation above.</div>
        </div>
        <div style="margin-top:12px;padding:10px 12px;background:#fffbeb;border:1px solid #fcd34d;border-radius:8px;font-size:.75rem;color:#78350f;line-height:1.55">
          <strong>Why S&P 500?</strong> Your portfolio holds VWCE (global equities, ~65% US) and XDW0 (energy). S&P 500 is a close proxy — the two typically move together, with 90–95% correlation in <em>local currency</em> terms. A trigger at −10% S&P 500 roughly corresponds to −8% to −12% on VWCE.<br><br>
          <strong>⚠ EUR/USD caveat:</strong> This correlation assumes a relatively stable EUR/USD rate. If the EUR strengthens significantly against the USD (more than ~5%), VWCE in EUR can fall while the S&P 500 in USD shows little drop — and vice versa. In periods of large currency moves, check <strong>VWCE.DE directly on Xetra or Yahoo Finance</strong> and use that level instead of the S&P 500 proxy.
        </div>
      </div>

      <!-- ── Right: computed metrics ── -->
      <div id="price-metrics">
        <div style="font-size:.6875rem;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-bottom:10px">Computed Drawdown</div>

        ${!ddSet ? `
          <div style="padding:16px;background:var(--bg);border:1px dashed var(--border);border-radius:8px;text-align:center;color:var(--muted);font-size:.8125rem">
            Enter your Day 1 level and current level on the left to calculate drawdown.
          </div>
        ` : `
          <!-- Primary metric: from plan start -->
          <div style="background:${dd<=-30?'#fef2f2':dd<=-10?'#fffbeb':'#f0fdf4'};border:1px solid ${dd<=-30?'#fca5a5':dd<=-10?'#fcd34d':'#86efac'};border-radius:8px;padding:12px 14px;margin-bottom:8px">
            <div style="font-size:.6875rem;color:var(--muted);margin-bottom:2px">From your plan start (Day 1)</div>
            <div style="font-size:2rem;font-weight:800;line-height:1;color:${ddColor(dd)}">${fmtP(dd)}</div>
            <div style="font-size:.75rem;margin-top:4px;color:var(--muted)">
              ${sl>0&&cl>0 ? `S&P: ${sl.toLocaleString()} → ${cl.toLocaleString()}` : 'From manual override'}
            </div>
            <div style="font-size:.8125rem;font-weight:600;margin-top:4px;color:${ddColor(dd)}">
              ${dd<=-30 ? '⚡ Deep-crash pivot active — redirect all remaining capital to VWCE/XDW0'
                : dd<=-10 ? '⚠ In trigger zone — check ladder below'
                : dd<0 ? '↓ Below start level — no trigger yet'
                : '✓ Above start level — no drawdown'}
            </div>
            ${proximityBar}
          </div>

          ${/* ATH metric (optional) */''}
          ${athDD !== null ? `
            <div style="background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:10px 14px;margin-bottom:8px">
              <div style="font-size:.6875rem;color:var(--muted);margin-bottom:2px">From all-time high (context only)</div>
              <div style="font-size:1.5rem;font-weight:700;line-height:1;color:${ddColor(athDD)}">${fmtP(athDD)}</div>
              <div style="font-size:.75rem;margin-top:4px;color:var(--muted)">ATH: ${ath.toLocaleString()} → now: ${cl.toLocaleString()}</div>
              <div style="font-size:.6875rem;margin-top:4px;color:var(--subtle);font-style:italic">Note: your triggers fire based on your Day 1 level, not ATH.</div>
            </div>
          ` : ''}

          ${firedTriggers.length>0 ? `
            <div style="background:#fef2f2;border:1px solid #fca5a5;border-radius:8px;padding:10px 14px">
              <div style="font-weight:600;color:var(--danger);font-size:.875rem;margin-bottom:4px">⚡ ${firedTriggers.length} trigger${firedTriggers.length>1?'s':''} fired — action required</div>
              ${firedTriggers.map(t=>`<div style="font-size:.8125rem;color:var(--text)">${t.threshold}%: deploy ${fmt(t.total)} → ${fmt(t.VWCE)} VWCE + ${fmt(t.XDW0)} XDW0</div>`).join('')}
            </div>
          ` : ''}
        `}
      </div>
    </div>
    </div><!-- /price-inputs -->

    ${collapsed && ddSet ? `
      <div style="display:flex;align-items:center;gap:16px;padding:4px 0;flex-wrap:wrap">
        <div style="font-size:1.1rem;font-weight:700;color:${ddColor(dd)}">${fmtP(dd)}</div>
        <div style="font-size:.8125rem;color:var(--muted)">from your plan start ${sl>0&&cl>0?`(${sl.toLocaleString()} → ${cl.toLocaleString()})`:''}</div>
        ${firedTriggers.length > 0 ? `<span style="font-size:.8125rem;font-weight:600;color:var(--danger)">⚡ ${firedTriggers.length} trigger${firedTriggers.length>1?'s':''} fired</span>` : ''}
      </div>` : ''}
  `;
}

// 12. EVENT DELEGATION
// ══════════════════════════════════════════════════════════════════
document.addEventListener('click', e => {
  const el = e.target.closest('[data-action]');
  if (!el) return;
  const action = el.dataset.action;

  if (action === 'mark-month0') {
    const b = C.month0Buys;
    const total = Object.values(b).reduce((s,v)=>s+v,0);
    if (!confirm(`Mark initial investment as complete?\n\nThis records ${fmt(total)} deployed across all assets.\n\nHave you completed this investment in your brokerage?`)) return;
    markMonth0();
  }
  else if (action === 'mark-dca') {
    const m = parseInt(el.dataset.month);
    const d = C.monthlyDCA;
    const total = Object.values(d).reduce((s,v)=>s+v,0);
    if (!confirm(`Mark Month ${m} monthly buy as complete?\n\nThis records ${fmt(total)} deployed.\n\nHave you completed this buy in your brokerage?`)) return;
    markDCA(m);
  }
  else if (action === 'execute-trigger') { executeTrigger(parseInt(el.dataset.threshold)); }
  else if (action === 'set-view')    { setState({activeView: el.dataset.view}); }
  else if (action === 'set-viewby')  { setState({viewBy: el.dataset.viewby}); }
  else if (action === 'set-scenario'){ setState({activeScenario: el.dataset.scenario}); }
  else if (action === 'clear-txns')     { setState({transactions:[]}); }
  else if (action === 'set-month-auto') { setState({currentMonth: parseInt(el.dataset.month)||0}); toast(`Month updated to ${el.dataset.month} ✓`); }
  else if (action === 'toggle-price-tracker') {
    setState({priceTrackerCollapsed: S.priceTrackerCollapsed !== true});  // true→false (expand), false/undefined→true (collapse)
  }
  else if (action === 'reset-state') {
    if (confirm('Reset all state? This cannot be undone.')) { S = {...DEFAULT_STATE}; C = deriveConfig(300000); saveState(); render(); }
  }
  else if (action === 'dl-status') {
    setState({lastExportedAt: Date.now()});
    download('portfolio-status.json', JSON.stringify({config:C,state:S,exportedAt:new Date().toISOString()},null,2));
    toast('Exported ✓ — keep this file somewhere safe');
  }
  else if (action === 'dl-config') {
    download('portfolio-config.json', JSON.stringify(C,null,2));
  }
  else if (action === 'mark-monitor-done') {
    setState({monitorTaskUpdated: true});
    toast('Monitoring task confirmed ✓ — daily email alerts are now active');
  }
  else if (action === 'copy-start-level') {
    const lvl = S.startLevel;
    if (!lvl) { toast('No start level set yet', 3000); return; }
    navigator.clipboard.writeText(String(lvl))
      .then(() => toast('Start level ' + lvl + ' copied to clipboard ✓'))
      .catch(() => toast('Copy failed — your start level is: ' + lvl, 6000));
  }
  else if (action === 'recover-backup') {
    recoverFromBackup();
  }
  else if (action === 'toggle-detail-section') {
    const sec = el.dataset.section;
    const nowCollapsed = !isSecCollapsed(sec);
    setState({detailSectionCollapsed: {...(S.detailSectionCollapsed||{}), [sec]: nowCollapsed}});
    // When expanding holdings, re-render chart (canvas enters the DOM)
    if (sec === 'holdings' && !nowCollapsed) {
      requestAnimationFrame(() => { renderAllocationChart(); renderAllocLegend(); });
    }
  }
  else if (action === 'clear-pivot-flag') {
    setState({deepCrashPivotActivated: false});
    toast('Deep-crash recovery acknowledged ✓ — resume IBCI/ERNX/CMOE/SGLD DCA gradually');
  }
});

document.addEventListener('change', e => {
  const el = e.target.closest('[data-action]');
  if (!el) return;
  const action = el.dataset.action;
  const val = el.value;

  if (action === 'set-capital') {
    const T = parseInt(val);
    const prevT = S.totalCapital || 300000;
    if (T >= 10000) {
      const changePct = Math.abs(T - prevT) / prevT * 100;
      if (changePct > 20) {
        if (!confirm(`Change total capital from €${prevT.toLocaleString('en-IE')} to €${T.toLocaleString('en-IE')}?\n\nThis rescales every plan target, DCA amount, and trigger tranche proportionally.\nAlready-marked holdings are NOT adjusted — only plan targets update.\n\nAre you sure?`)) {
          el.value = prevT;  // revert the input
          return;
        }
      }
      setState({totalCapital:T});
    }
  }
  else if (action === 'set-month')      { setState({currentMonth: parseInt(val)||0}); }
  else if (action === 'set-startdate')  { setState({startDate: val}); }
  else if (action === 'set-startlevel') {
    const v = parseFloat(val);
    if (val && !isNaN(v) && v > 0 && v < 500) toast('⚠ That level seems low for S&P 500 (typical range: 1,000–8,000). Double-check before saving.', 6000);
    setState({startLevel: val, manualDrawdown:''});
    if (val && parseFloat(val) > 500 && !S.monitorTaskUpdated) {
      toast('Start level saved. Remember to update your daily monitoring task (portfolio-sp500-monitor) with this value to activate email alerts.', 7000);
    }
  }
  else if (action === 'set-athlevel')   { setState({athLevel: val}); }
  else if (action === 'set-currentlevel') {
    const prevDD = getDrawdownPct();
    setState({currentLevel: val, manualDrawdown:'', lastPriceUpdatedAt: Date.now()});
    const newDD = getDrawdownPct();
    if (newDD !== prevDD) checkAndAlertTriggers(prevDD, newDD);
    // Latch deep-crash pivot flag when market crosses −30%
    if (newDD <= -30 && !S.deepCrashPivotActivated) setState({deepCrashPivotActivated: true});
  }
  else if (action === 'set-manual-dd') {
    const prevDD = getDrawdownPct();
    setState({manualDrawdown: val, lastPriceUpdatedAt: Date.now()});
    const newDD = getDrawdownPct();
    if (newDD !== prevDD) checkAndAlertTriggers(prevDD, newDD);
    if (newDD <= -30 && !S.deepCrashPivotActivated) setState({deepCrashPivotActivated: true});
  }
  else if (action === 'set-holding') {
    const h = {...S.holdings, [el.dataset.asset]: parseFloat(val)||0};
    setState({holdings:h});
  }
  else if (action === 'set-dca-day')    { setState({dcaDay: parseInt(val)||null}); }
  else if (action === 'set-marketvalue') {
    const mv = {...(S.marketValues||{}), [el.dataset.asset]: parseFloat(val)||0};
    setState({marketValues: mv});
  }
  else if (action === 'set-notes')      { S.notes = val; saveState(); /* no full re-render */ }
});

// ══════════════════════════════════════════════════════════════════
// 13. IMPORT / EXPORT
// ══════════════════════════════════════════════════════════════════
function download(filename, content) {
  const blob = new Blob([content], {type:'application/json'});
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  a.href=url; a.download=filename; a.click();
  URL.revokeObjectURL(url);
}

function importJSON() {
  const input = document.createElement('input');
  input.type='file'; input.accept='.json';
  input.onchange = e => {
    const file = e.target.files[0];
    const reader = new FileReader();
    reader.onload = ev => {
      try {
        const data = JSON.parse(ev.target.result);
        if (data.state) { Object.assign(S, data.state); }
        else { Object.assign(S, data); }
        if (data.config?.totalCapital) S.totalCapital = data.config.totalCapital;
        C = deriveConfig(S.totalCapital||300000);
        saveState(); render();
        toast('Imported successfully ✓');
      } catch { toast('Invalid JSON file', 4000); }
    };
    reader.readAsText(file);
  };
  input.click();
}
